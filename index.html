const MORPHEMES = [
  // ============ PREFIXES 字首 (方位/時間) ============
  { id:'ante', type:'prefix', form:'ante-', cat:'方位時間', zh:'在前、之前', en:'before, in front of', examples:[{w:'antecedent',m:'先前的、前例'},{w:'antebellum',m:'戰前的'},{w:'antedate',m:'早於、提前日期'}] },
  { id:'pre', type:'prefix', form:'pre-', cat:'方位時間', zh:'在…之前、預先', en:'before, prior to', examples:[{w:'predict',m:'預測'},{w:'prevent',m:'預防'},{w:'preview',m:'預覽'}] },
  { id:'pro', type:'prefix', form:'pro-', cat:'方位時間', zh:'向前、代替、贊同', en:'forward, in favor of', examples:[{w:'proceed',m:'前進'},{w:'propose',m:'提議'},{w:'prologue',m:'序言'}] },

  { id:'post', type:'prefix', form:'post-', cat:'方位時間', zh:'在…之後', en:'after, behind', examples:[{w:'postpone',m:'延遲'},{w:'postscript',m:'附筆(P.S.)'},{w:'postwar',m:'戰後的'}] },
  { id:'re', type:'prefix', form:'re-', cat:'方位時間', zh:'再、重新、回', en:'again, back', examples:[{w:'return',m:'返回'},{w:'review',m:'複習'},{w:'reject',m:'拒絕'}] },
  { id:'retro', type:'prefix', form:'retro-', cat:'方位時間', zh:'向後、倒退', en:'backward', examples:[{w:'retrospect',m:'回顧'},{w:'retrograde',m:'倒退的'},{w:'retroactive',m:'追溯的'}] },
  { id:'ex', type:'prefix', form:'ex-/e-', cat:'方位時間', zh:'向外、出、前任', en:'out, out of, former', examples:[{w:'exit',m:'出口'},{w:'export',m:'出口(輸出)'},{w:'exclude',m:'排除'}] },
  { id:'extra', type:'prefix', form:'extra-', cat:'方位時間', zh:'在…之外、超出', en:'outside, beyond', examples:[{w:'extraordinary',m:'非凡的'},{w:'extraterrestrial',m:'外星的'}] },
  { id:'intra', type:'prefix', form:'intra-', cat:'方位時間', zh:'在內、向內', en:'within, inside', examples:[{w:'intranet',m:'內部網路'},{w:'intravenous',m:'靜脈內的'}] },
  { id:'intro', type:'prefix', form:'intro-', cat:'方位時間', zh:'向內、進入', en:'into, within', examples:[{w:'introduce',m:'介紹'},{w:'introvert',m:'內向者'}] },
  { id:'in_into', type:'prefix', form:'in-/im-', cat:'方位時間', zh:'進入、向內', en:'in, into', examples:[{w:'inject',m:'注射'},{w:'import',m:'進口'},{w:'immerse',m:'浸入'}], note:'此 in- 表「進入」，與否定的 in- 同形異義' },
  { id:'en', type:'prefix', form:'en-/em-', cat:'方位時間', zh:'使進入、使成為', en:'to put into, to make', examples:[{w:'enclose',m:'圍住'},{w:'empower',m:'賦權'},{w:'embrace',m:'擁抱'}] },
  { id:'out', type:'prefix', form:'out-', cat:'方位時間', zh:'向外、超過', en:'out, beyond', examples:[{w:'outlook',m:'展望'},{w:'outnumber',m:'數量超過'},{w:'outbreak',m:'爆發'}] },
  { id:'over', type:'prefix', form:'over-', cat:'方位時間', zh:'在上、過度', en:'over, above, excessive', examples:[{w:'overlook',m:'俯瞰/忽略'},{w:'overcome',m:'克服'},{w:'overestimate',m:'高估'}] },
  { id:'super', type:'prefix', form:'super-', cat:'方位時間', zh:'在上、超越', en:'above, over, beyond', examples:[{w:'superior',m:'上級的'},{w:'supervise',m:'監督'},{w:'superb',m:'極好的'}] },
  { id:'supra', type:'prefix', form:'supra-', cat:'方位時間', zh:'在…之上', en:'above, over', examples:[{w:'supranational',m:'超國家的'},{w:'supraorbital',m:'眼窩上的'}] },
  { id:'sur', type:'prefix', form:'sur-', cat:'方位時間', zh:'超出、在上', en:'over, above', examples:[{w:'surface',m:'表面'},{w:'surpass',m:'超越'},{w:'surmount',m:'克服'}] },
  { id:'sub', type:'prefix', form:'sub-/sup-/suf-', cat:'方位時間', zh:'在下、次級', en:'under, below', examples:[{w:'submarine',m:'潛艇'},{w:'suppress',m:'壓制'},{w:'suffer',m:'受苦'}] },

  { id:'s_ing', type:'suffix', form:'-ing', cat:'形容詞', zh:'令人…的、進行中的', en:'causing, ongoing', examples:[{w:'interesting',m:'有趣的'},{w:'amazing',m:'驚人的'}] },
];

// ============ APP STATE ============
const STATE_KEY = 'morphemeMasterV1';
const DEFAULT_STATE = {
  srs: {},          // { id: { box, ease, interval, reps, lapses, nextReview, lastReview, correct, wrong, recent: [0/1,...] } }
  stats: {
    totalAnswered: 0,
    totalCorrect: 0,
    totalWrong: 0,
    sessions: [],   // { date, answered, correct }
    streak: 0,
    lastActiveDate: null,
    learnedIds: [],
  },
  settings: {
    newPerSession: 10,
    reviewBatch: 20,
    dark: false,
    questionMix: { meaningFromForm:true, formFromMeaning:true, exampleToMorpheme:true },
    filterCat: 'all',
    filterType: 'all',
  },
  view: 'dashboard',
};

// ============ AUTH & CLOUD SYNC ============
let currentUser = null;
let cloudSyncTimer = null;

function mergeState(data) {
  return { ...structuredClone(DEFAULT_STATE), ...data,
    settings: {...DEFAULT_STATE.settings, ...(data.settings||{})},
    stats:    {...DEFAULT_STATE.stats,    ...(data.stats||{})} };
}

function loadStateLocal() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    return raw ? mergeState(JSON.parse(raw)) : structuredClone(DEFAULT_STATE);
  } catch(e) { return structuredClone(DEFAULT_STATE); }
}

async function loadStateFromCloud(uid) {
  try {
    const doc = await db.collection('users').doc(uid).get();
    if (doc.exists) {
      state = mergeState(doc.data());
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }
  } catch(e) { console.warn('Cloud load failed, using local:', e); }
}

function saveStateToCloud() {
  if (!currentUser) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(async () => {
    try {
      await db.collection('users').doc(currentUser.uid).set(state);
    } catch(e) { console.warn('Cloud save failed:', e); }
  }, 2500); // debounce: write to Firestore at most once every 2.5s
}

function saveState() {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
  saveStateToCloud();
}

let state = loadStateLocal();

function todayStr() { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function updateStreak() {
  const today = todayStr();
  const last = state.stats.lastActiveDate;
  if (last === today) return;
  if (!last) { state.stats.streak = 1; }
  else {
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const y = yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');
    state.stats.streak = (last === y) ? state.stats.streak+1 : 1;
  }
  state.stats.lastActiveDate = today;
  saveState();
}

// ============ SRS (SM-2 simplified) ============
function getSrs(id) {
  if (!state.srs[id]) {
    state.srs[id] = { box:0, ease:2.5, interval:0, reps:0, lapses:0, nextReview:0, lastReview:0, correct:0, wrong:0, recent:[] };
  }
  return state.srs[id];
}

// quality: 0 (wrong), 1 (hard), 2 (good), 3 (easy)
function scheduleReview(id, quality) {
  const s = getSrs(id);
  s.lastReview = Date.now();
  s.reps += 1;
  if (quality === 0) {
    s.wrong += 1;
    s.lapses += 1;
    s.box = Math.max(0, s.box - 1);
    s.interval = 0;
    s.ease = Math.max(1.3, s.ease - 0.2);
  } else {
    s.correct += 1;
    if (quality >= 2) s.box = Math.min(5, s.box + 1);
    const baseIntervals = [0.007, 1, 3, 7, 16, 35, 90]; // days
    s.interval = baseIntervals[s.box] || 90;
    if (quality === 3) s.ease = Math.min(3.0, s.ease + 0.1);
    if (quality === 1) s.ease = Math.max(1.3, s.ease - 0.1);
  }
  s.nextReview = Date.now() + s.interval * 86400000;
  s.recent.push(quality === 0 ? 0 : 1);
  if (s.recent.length > 8) s.recent.shift();

  // stats
  state.stats.totalAnswered += 1;
  if (quality === 0) state.stats.totalWrong += 1; else state.stats.totalCorrect += 1;
  const today = todayStr();
  let session = state.stats.sessions.find(x => x.date === today);
  if (!session) { session = { date: today, answered: 0, correct: 0 }; state.stats.sessions.push(session); }
  session.answered += 1;
  if (quality !== 0) session.correct += 1;

  if (!state.stats.learnedIds.includes(id) && s.reps >= 1) state.stats.learnedIds.push(id);

  updateStreak();
  saveState();
}

function getDueIds() {
  const now = Date.now();
  return Object.keys(state.srs).filter(id => state.srs[id].nextReview <= now && state.srs[id].reps > 0);
}
function getErrorProneIds() {
  // weak if: recent accuracy < 60% OR lapses >= 2 OR box <= 1 with reps >= 2
  return Object.keys(state.srs).filter(id => {
    const s = state.srs[id];
    if (s.reps < 2) return false;
    const recent = s.recent.slice(-5);
    const acc = recent.length ? recent.reduce((a,b)=>a+b,0)/recent.length : 1;
    return acc < 0.6 || s.lapses >= 2 || (s.box <= 1 && s.reps >= 2);
  });
}
function getUnlearnedIds() {
  return MORPHEMES.filter(m => !state.srs[m.id] || state.srs[m.id].reps === 0).map(m => m.id);
}

// ============ QUESTION GENERATORS ============
function pickN(arr, n, excludeId) {
  const pool = arr.filter(x => x.id !== excludeId);
  const out = [];
  while (out.length < n && pool.length) {
    const i = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function byType(t) { return MORPHEMES.filter(m => m.type === t); }

function genQuestion(item, mode) {
  mode = mode || randomMode(item);
  const sameType = byType(item.type);
  if (mode === 'meaning_from_form') {
    const distractors = pickN(sameType, 3, item.id);
    const opts = [item, ...distractors].sort(() => Math.random()-0.5);
    return {
      type: 'mcq',
      mode,
      prompt: `<div class="text-center py-3 md:py-4">
        <div class="text-xs text-slate-400 mb-2">${typeLabel(item.type)}的意思是？</div>
        <div class="mono font-bold text-indigo-600 text-3xl md:text-4xl mb-1">${item.form}</div>
      </div>`,
      options: opts.map(o => ({ label: `${o.zh} <span class="text-xs text-slate-400 block md:inline">${o.en}</span>`, correct: o.id === item.id })),
      item,
    };
  }
  if (mode === 'form_from_meaning') {
    const distractors = pickN(sameType, 3, item.id);
    const opts = [item, ...distractors].sort(() => Math.random()-0.5);
    return {
      type: 'mcq',
      mode,
      prompt: `<div class="text-center py-3 md:py-4">
        <div class="text-xs text-slate-400 mb-2">意思為下列的${typeLabel(item.type)}是？</div>
        <div class="font-bold text-indigo-600 text-2xl md:text-3xl mb-1">${item.zh}</div>
        <div class="text-sm text-slate-500">${item.en}</div>
      </div>`,
      options: opts.map(o => ({ label: `<span class="mono font-bold text-base">${o.form}</span>`, correct: o.id === item.id })),
      item,
    };
  }
  if (mode === 'example_to_morpheme') {
    if (!item.examples || !item.examples.length) return genQuestion(item, 'meaning_from_form');
    const ex = item.examples[Math.floor(Math.random() * item.examples.length)];
    const distractors = pickN(sameType, 3, item.id);
    const opts = [item, ...distractors].sort(() => Math.random()-0.5);
    return {
      type: 'mcq',
      mode,
      prompt: `<div class="text-center py-3 md:py-4">
        <div class="text-xs text-slate-400 mb-2">下列單字含有哪個${typeLabel(item.type)}？</div>
        <div class="font-bold text-indigo-600 text-2xl md:text-3xl mb-1">${ex.w}</div>
        <div class="text-sm text-slate-500">${ex.m}</div>
      </div>`,
      options: opts.map(o => ({ label: `<span class="mono font-bold text-base">${o.form}</span> <span class="text-xs text-slate-500">${o.zh}</span>`, correct: o.id === item.id })),
      item,
    };
  }
  return genQuestion(item, 'meaning_from_form');
}
function typeLabel(t) { return t === 'prefix' ? '字首' : t === 'root' ? '字根' : '字尾'; }
function randomMode(item) {
  const modes = [];
  if (state.settings.questionMix.meaningFromForm) modes.push('meaning_from_form');
  if (state.settings.questionMix.formFromMeaning) modes.push('form_from_meaning');
  if (state.settings.questionMix.exampleToMorpheme && item.examples && item.examples.length) modes.push('example_to_morpheme');
  if (!modes.length) return 'meaning_from_form';
  return modes[Math.floor(Math.random() * modes.length)];
}

function renderWeekChart() {

    return;
  }
  const item = learnSession.queue[learnSession.idx];
  const progress = Math.round(100 * learnSession.idx / learnSession.queue.length);
  if (learnSession.phase === 'intro') {
    app.innerHTML = `<div class="max-w-3xl mx-auto">

    $('#skipLearn').onclick = () => { learnSession.idx++; renderLearn(); };
    $('#testLearn').onclick = () => { learnSession.phase = 'test'; renderLearn(); };

  }

      learnSession.idx++;
      renderLearn();
    }, 1200);
  }, { header: `${learnSession.idx+1}/${learnSession.queue.length} · 學習測驗` });
}

function renderMCQ(q, onAnswer, opts) {
  opts = opts || {};
  app.innerHTML = `<div class="max-w-3xl mx-auto">
    ${opts.header ? `<div class="text-xs text-slate-500 mb-2">${opts.header}</div>` : ''}
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 p-4 md:p-6">
      ${q.prompt}
      <div class="grid gap-2.5 mt-4" id="mcqOpts">
        ${q.options.map((o, i) => `<button data-i="${i}" class="answer-btn tap text-left px-4 py-3.5 border-2 border-slate-200 dark:border-slate-600 rounded-xl hover:border-indigo-400 dark:hover:border-indigo-400 active:scale-[0.98] transition-transform">
          <span class="inline-flex items-center justify-center w-6 h-6 text-xs font-bold text-slate-400 bg-slate-100 dark:bg-slate-700 rounded-full mr-2 flex-shrink-0">${String.fromCharCode(65+i)}</span>${o.label}
        </button>`).join('')}
      </div>
      <div id="mcqFeedback" class="mt-4 hidden"></div>
    </div>
    <div class="hide-sm text-xs text-slate-400 text-center mt-3">按 <kbd>A</kbd>/<kbd>B</kbd>/<kbd>C</kbd>/<kbd>D</kbd> 或 <kbd>1</kbd>-<kbd>4</kbd> 選擇</div>
  </div>`;
  let answered = false;
  function handle(i) {
    if (answered) return; answered = true;
    const btns = $$('#mcqOpts button');
    btns.forEach((b, idx) => {
      if (q.options[idx].correct) b.classList.add('correct');
      if (idx === i && !q.options[idx].correct) b.classList.add('wrong');
      b.disabled = true;
    });
    const isCorrect = q.options[i].correct;
    const fb = $('#mcqFeedback');
    fb.classList.remove('hidden');
    if (isCorrect) {
      fb.innerHTML = `<div class="p-3 bg-green-50 dark:bg-green-900/30 text-green-800 dark:text-green-200 rounded">✅ 答對了！</div>`;
    } else {
      fb.innerHTML = `<div class="p-3 bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-200 rounded">
        ❌ 答錯了。${renderAnswerExplain(q.item)}
      </div>`;
    }
    onAnswer(isCorrect);
  }
  $$('#mcqOpts button').forEach((b, i) => b.onclick = () => handle(i));
  document.onkeydown = (e) => {
    if (answered) return;
    const k = e.key.toLowerCase();
    const map = { 'a':0,'b':1,'c':2,'d':3,'1':0,'2':1,'3':2,'4':3 };
    if (k in map) { e.preventDefault(); handle(map[k]); }
  };
}
function renderAnswerExplain(item) {
  return `<div class="mt-2 text-sm">
    <div class="mono font-bold text-indigo-700 dark:text-indigo-300">${item.form}</div>
    <div>${item.zh} · ${item.en}</div>

}

      <div class="grid md:grid-cols-4 gap-3">
        <input id="bQ" value="${browseFilter.q}" placeholder="🔍 搜尋形式、中英意思、例字…" class="md:col-span-2 px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-900 rounded-lg">
        <select id="bType" class="px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-900 rounded-lg">
          <option value="all">全部類型</option>
          <option value="prefix" ${browseFilter.type==='prefix'?'selected':''}>字首</option>
          <option value="root" ${browseFilter.type==='root'?'selected':''}>字根</option>
          <option value="suffix" ${browseFilter.type==='suffix'?'selected':''}>字尾</option>
        </select>
        <select id="bCat" class="px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-900 rounded-lg">
          <option value="all">全部分類</option>
          ${cats.map(c => `<option value="${c}" ${browseFilter.cat===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="flex items-center gap-2 mt-3 text-xs text-slate-500 flex-wrap">
        <span>排序：</span>
        ${['form','box','recent'].map(s => `<button data-s="${s}" class="bSort px-2 py-1 rounded ${browseFilter.sort===s?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-slate-700'}">${s==='form'?'字母':s==='box'?'熟練度':'最近學習'}</button>`).join('')}
        <span class="ml-auto" id="bCount"></span>
      </div>
    </div>
    <div id="bList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </div>`;
  ['bQ','bType','bCat'].forEach(id => $('#'+id).oninput = $('#'+id).onchange = () => updateBrowse());
  $$('.bSort').forEach(b => b.onclick = () => { browseFilter.sort = b.dataset.s; renderBrowse(); });
  updateBrowse();
}
function updateBrowse() {
  browseFilter.q = $('#bQ').value.trim().toLowerCase();
  browseFilter.type = $('#bType').value;
  browseFilter.cat = $('#bCat').value;
  let items = MORPHEMES.slice();
  if (browseFilter.type !== 'all') items = items.filter(m => m.type === browseFilter.type);
  if (browseFilter.cat !== 'all') items = items.filter(m => m.cat === browseFilter.cat);
  if (browseFilter.q) {
    const q = browseFilter.q;
    items = items.filter(m =>
      m.form.toLowerCase().includes(q) ||
      (m.zh||'').toLowerCase().includes(q) ||
      (m.en||'').toLowerCase().includes(q) ||
      (m.examples||[]).some(e => e.w.toLowerCase().includes(q) || e.m.toLowerCase().includes(q))
    );
  }
  if (browseFilter.sort === 'form') items.sort((a,b) => a.form.localeCompare(b.form));
  if (browseFilter.sort === 'box') items.sort((a,b) => ((state.srs[b.id]||{box:0}).box) - ((state.srs[a.id]||{box:0}).box));
  if (browseFilter.sort === 'recent') items.sort((a,b) => ((state.srs[b.id]||{lastReview:0}).lastReview) - ((state.srs[a.id]||{lastReview:0}).lastReview));
  $('#bCount').textContent = `${items.length} 項`;
  $('#bList').innerHTML = items.map(m => {
    const s = state.srs[m.id];
    const box = s ? s.box : 0;
    return `<div class="bg-white dark:bg-slate-800 rounded-lg p-4 border border-slate-100 dark:border-slate-700 card cursor-pointer" onclick="showDetail('${m.id}')">
      <div class="flex items-center justify-between">
        <span class="chip ${typeChipClass(m.type)}">${typeLabel(m.type)}</span>
        <div class="flex gap-0.5">${[0,1,2,3,4].map(i => `<div class="w-1.5 h-1.5 rounded-full ${i<box?'bg-indigo-500':'bg-slate-200 dark:bg-slate-600'}"></div>`).join('')}</div>
      </div>
      <div class="mono text-xl font-bold mt-2 text-indigo-600">${m.form}</div>
      <div class="text-sm mt-1">${m.zh}</div>
      <div class="text-xs text-slate-400 truncate">${m.en}</div>
      ${m.examples && m.examples.length ? `<div class="text-xs text-slate-500 mt-2 truncate">e.g. ${m.examples.slice(0,3).map(e=>e.w).join(', ')}</div>` : ''}
    </div>`;
  }).join('');
}
window.showDetail = function(id) {
  const m = MORPHEMES.find(x => x.id === id);
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
  modal.innerHTML = `<div class="bg-white dark:bg-slate-800 rounded-xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-auto">
    <button class="absolute top-3 right-3 text-slate-400 hover:text-slate-600" onclick="this.parentElement.parentElement.remove()">✕</button>
    ${renderMorphemeCard(m, true)}
    <div class="mt-3 grid grid-cols-2 gap-2">
      <button class="px-3 py-2 bg-slate-100 dark:bg-slate-700 rounded" onclick="this.parentElement.parentElement.parentElement.remove()">關閉</button>
      <button class="px-3 py-2 bg-indigo-600 text-white rounded" onclick="this.parentElement.parentElement.parentElement.remove(); quickTest('${id}')">立即測驗</button>
    </div>
  </div>`;
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
};
window.quickTest = function(id) {
  const item = MORPHEMES.find(x => x.id === id);
  const q = genQuestion(item);
  renderMCQ(q, (correct) => scheduleReview(id, correct ? 2 : 0), { header: '快速測驗' });
};

// ============ STATS VIEW ============
function renderStats() {
  const total = MORPHEMES.length;
  const learned = state.stats.learnedIds.length;
  const mastered = Object.values(state.srs).filter(s => s.box >= 4).length;
  const acc = state.stats.totalAnswered ? Math.round(100 * state.stats.totalCorrect / state.stats.totalAnswered) : 0;

  // Box distribution
  const boxDist = [0,0,0,0,0,0];
  Object.values(state.srs).forEach(s => { boxDist[s.box] += 1; });
  const untouched = total - Object.keys(state.srs).length;

  // History last 30 days
  const days = [];
  for (let i=29; i>=0; i--) { const d = new Date(); d.setDate(d.getDate()-i); days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
  const maxA = Math.max(1, ...days.map(dt => (state.stats.sessions.find(s=>s.date===dt)||{answered:0}).answered));

  app.innerHTML = `<div class="max-w-5xl mx-auto space-y-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${statBox('已學詞素', `${learned} / ${total}`, 'text-indigo-600')}
      ${statBox('已精熟', mastered, 'text-emerald-600')}
      ${statBox('總作答', state.stats.totalAnswered, 'text-blue-600')}
      ${statBox('正確率', acc+'%', 'text-green-600')}
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
      <h3 class="font-bold mb-3">📦 熟練度分布（Leitner Boxes）</h3>
      <div class="space-y-2 text-sm">
        <div class="flex items-center gap-2"><span class="w-16 text-slate-500">未學</span><div class="flex-1 bg-slate-100 dark:bg-slate-700 h-4 rounded overflow-hidden"><div class="bg-slate-400 h-full" style="width:${100*untouched/total}%"></div></div><span class="w-10 text-right mono">${untouched}</span></div>
        ${boxDist.map((n,i) => `<div class="flex items-center gap-2">
          <span class="w-16 text-slate-500">Box ${i}</span>
          <div class="flex-1 bg-slate-100 dark:bg-slate-700 h-4 rounded overflow-hidden"><div class="h-full heat-${Math.min(5,i+1)}" style="width:${100*n/total}%"></div></div>
          <span class="w-10 text-right mono">${n}</span>
        </div>`).join('')}
      </div>
      <div class="text-xs text-slate-400 mt-2">Box 越高代表記憶越穩固、下次複習間隔越長。Box 5 = 90 天。</div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
      <h3 class="font-bold mb-3">📅 過去 30 天</h3>
      <div class="flex items-end gap-0.5 h-32">
        ${days.map(dt => {
          const s = state.stats.sessions.find(x=>x.date===dt) || {answered:0,correct:0};
          const pct = 100 * s.answered / maxA;
          return `<div class="flex-1 flex items-end h-full group relative">
            <div class="w-full bg-indigo-200 dark:bg-indigo-900 rounded-t" style="height:${Math.max(2,pct)}%">
              <div class="progress-bar h-full rounded-t"></div>
            </div>
            <span class="hidden group-hover:block absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-2 py-0.5 rounded whitespace-nowrap">${dt}: ${s.answered}題 (${s.answered?Math.round(100*s.correct/s.answered):0}%)</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
      <h3 class="font-bold mb-3">📂 分類學習進度</h3>
      ${renderCategorySummary()}
    </div>
  </div>`;
}
function statBox(label, value, cls) {
  return `<div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-700">
    <div class="text-xs text-slate-500">${label}</div>
    <div class="text-2xl font-bold ${cls} mt-1">${value}</div>
  </div>`;
}

// ============ SETTINGS VIEW ============
function renderSettings() {
  app.innerHTML = `<div class="max-w-2xl mx-auto space-y-4">
    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
      <h3 class="font-bold mb-3">🎛️ 學習參數</h3>
      <label class="block mb-3">
        <div class="text-sm font-medium">每次「學新詞素」數量：<span id="npsVal">${state.settings.newPerSession}</span></div>
        <input type="range" id="nps" min="3" max="30" value="${state.settings.newPerSession}" class="w-full">
      </label>
      <label class="block mb-3">
        <div class="text-sm font-medium">每次「複習」批次大小：<span id="rbVal">${state.settings.reviewBatch}</span></div>
        <input type="range" id="rb" min="5" max="50" value="${state.settings.reviewBatch}" class="w-full">
      </label>
      <div class="text-sm font-medium mt-4">題型組合</div>
      <label class="flex items-center gap-2 mt-1 text-sm"><input type="checkbox" id="qm1" ${state.settings.questionMix.meaningFromForm?'checked':''}> 形式 → 意思</label>
      <label class="flex items-center gap-2 mt-1 text-sm"><input type="checkbox" id="qm2" ${state.settings.questionMix.formFromMeaning?'checked':''}> 意思 → 形式</label>
      <label class="flex items-center gap-2 mt-1 text-sm"><input type="checkbox" id="qm3" ${state.settings.questionMix.exampleToMorpheme?'checked':''}> 例字 → 詞素</label>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
      <h3 class="font-bold mb-3">💾 資料備份</h3>
      <p class="text-sm text-slate-500 mb-3">學習進度已自動同步到雲端（Google 帳號）。也可匯出為 JSON 備份。</p>
      <div class="grid grid-cols-2 gap-2">
        <button id="exportBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">📥 匯出資料</button>
        <button id="importBtn" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 rounded-lg">📤 匯入資料</button>
      </div>
      <input type="file" id="importFile" accept=".json" class="hidden">
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-red-200 dark:border-red-900">
      <h3 class="font-bold mb-3 text-red-700 dark:text-red-400">⚠️ 重設</h3>
      <button id="resetBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg">重設所有學習進度</button>
    </div>
    <div class="text-center text-xs text-slate-400" id="settingsFooter">Morpheme Master · 自我調整學習 · ☁ 雲端同步</div>
  </div>`;

  $('#nps').oninput = e => { state.settings.newPerSession = parseInt(e.target.value); $('#npsVal').textContent = e.target.value; saveState(); };
  $('#rb').oninput = e => { state.settings.reviewBatch = parseInt(e.target.value); $('#rbVal').textContent = e.target.value; saveState(); };
  ['qm1','qm2','qm3'].forEach((id, i) => {
    const key = ['meaningFromForm','formFromMeaning','exampleToMorpheme'][i];
    $('#'+id).onchange = e => { state.settings.questionMix[key] = e.target.checked; saveState(); };
  });
  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = 'morpheme-master-backup-' + todayStr() + '.json';
    a.click(); URL.revokeObjectURL(url);
    toast('已匯出備份');
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!imported.srs || !imported.stats) throw new Error('格式錯誤');
        state = { ...structuredClone(DEFAULT_STATE), ...imported, settings: {...DEFAULT_STATE.settings, ...(imported.settings||{})}, stats: {...DEFAULT_STATE.stats, ...(imported.stats||{})} };
        saveState(); toast('匯入成功'); render();
      } catch(err) { toast('匯入失敗：'+err.message); }
    };
    reader.readAsText(f);
  };
  $('#resetBtn').onclick = () => {
    if (confirm('確定要清除所有學習進度？此動作無法復原。')) {
      state = structuredClone(DEFAULT_STATE);
      saveState(); toast('已重設'); render();
    }
  };
}

// ============ INIT ============
function applyDark() {
  if (state.settings.dark) document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}
$('#darkToggle').onclick = () => { state.settings.dark = !state.settings.dark; saveState(); applyDark(); };
applyDark();

$$('.sidebar-link').forEach(a => { a.addEventListener('click', () => setView(a.getAttribute('data-view'))); });

// ============ AUTH ============
// Google Sign-In
$('#googleSignInBtn').onclick = async () => {
  $('#loginError').classList.add('hidden');
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  } catch(e) {
    $('#loginError').textContent = '登入失敗：' + (e.message || e.code);
    $('#loginError').classList.remove('hidden');
  }
};

// Logout
$('#logoutBtn').onclick = async () => {
  if (confirm('確定要登出？本機進度仍會保留。')) {
    await auth.signOut();
  }
};

// Auth state listener — runs on page load and on login/logout
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    // Load cloud state (may override local)
    await loadStateFromCloud(user.uid);
    applyDark();
    // Update sidebar user profile
    const profile = $('#userProfile');
    profile.classList.remove('hidden');
    profile.classList.add('flex');
    $('#userAvatar').src = user.photoURL || '';
    $('#userName').textContent = user.displayName || user.email;
    // Hide login screen and start app
    $('#loginScreen').style.display = 'none';
    setView(state.view || 'dashboard');
  } else {
    currentUser = null;
    $('#userProfile').classList.add('hidden');
    $('#userProfile').classList.remove('flex');
    // Show login screen
    $('#loginScreen').style.display = 'flex';
  }
});
</script>
</body>
</html>
